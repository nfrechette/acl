name: benchmark

on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - '**/*.md'

permissions:
  contents: read

# Cancel the previous run of a pull request when it receives new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Building (release-x64)
        uses: docker://ghcr.io/nfrechette/toolchain-amd64-resolute:v1
        with:
          args: 'python3 make.py -ci -compiler clang23 -config Release -cpu x64 -bench -build'
