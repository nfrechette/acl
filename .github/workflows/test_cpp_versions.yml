name: test cpp versions

on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - '**/*.md'

permissions:
  contents: read

# Cancel the previous run of a pull request when it receives new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc15, clang23]
        cpp_version: [14, 17, 20]
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Building (release-x86)
        uses: docker://ghcr.io/nfrechette/toolchain-amd64-resolute:v1
        with:
          args: 'python3 make.py -ci -compiler ${{ matrix.compiler }} -config Release -cpu x86 -cpp_version ${{ matrix.cpp_version }} -build'
      - name: Clean
        uses: docker://ghcr.io/nfrechette/toolchain-amd64-resolute:v1
        with:
          args: 'python3 make.py -clean_only'
      - name: Building (release-x64)
        uses: docker://ghcr.io/nfrechette/toolchain-amd64-resolute:v1
        with:
          args: 'python3 make.py -ci -compiler ${{ matrix.compiler }} -config Release -cpu x64 -cpp_version ${{ matrix.cpp_version }} -build'
      - name: Clean
        uses: docker://ghcr.io/nfrechette/toolchain-amd64-resolute:v1
        with:
          args: 'python3 make.py -clean_only'
      - name: Building (release-x64 nosimd)
        uses: docker://ghcr.io/nfrechette/toolchain-amd64-resolute:v1
        with:
          args: 'python3 make.py -ci -compiler ${{ matrix.compiler }} -config Release -cpu x64 -cpp_version ${{ matrix.cpp_version }} -nosimd -build'
      - name: Clean
        uses: docker://ghcr.io/nfrechette/toolchain-amd64-resolute:v1
        with:
          args: 'python3 make.py -clean_only'
      - name: Building (release-x64 AVX)
        uses: docker://ghcr.io/nfrechette/toolchain-amd64-resolute:v1
        with:
          args: 'python3 make.py -ci -compiler ${{ matrix.compiler }} -config Release -cpu x64 -cpp_version ${{ matrix.cpp_version }} -avx -build'

  vs2026:
    runs-on: windows-2025
    strategy:
      matrix:
        cpp_version: [14, 17, 20]
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Building (release-x86)
        run: python3 make.py -ci -compiler vs2026 -config Release -cpu x86 -cpp_version ${{ matrix.cpp_version }} -build
      - name: Clean
        run: python3 make.py -clean_only
      - name: Building (release-x64)
        run: python3 make.py -ci -compiler vs2026 -config Release -cpu x64 -cpp_version ${{ matrix.cpp_version }} -build
      - name: Clean
        run: python3 make.py -clean_only
      - name: Building (release-arm64)
        run: python3 make.py -ci -compiler vs2026 -config Release -cpu arm64 -cpp_version ${{ matrix.cpp_version }} -build
      - name: Clean
        run: python3 make.py -clean_only
      - name: Building (release-x64 nosimd)
        run: python3 make.py -ci -compiler vs2026 -config Release -cpu x64 -cpp_version ${{ matrix.cpp_version }} -nosimd -build
      - name: Clean
        run: python3 make.py -clean_only
      - name: Building (release-x64 AVX)
        run: python3 make.py -ci -compiler vs2026 -config Release -cpu x64 -cpp_version ${{ matrix.cpp_version }} -avx -build
