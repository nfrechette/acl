sonar.organization=nfrechette-github

sonar.projectKey=nfrechette_acl
sonar.projectName=Animation Compression Library
sonar.projectVersion=2.1.99

sonar.sources=includes,tests/sources,tests/main_generic,tools/acl_compressor/sources,tools/acl_compressor/main_generic,tools/acl_decompressor/main_generic

sonar.cfamily.build-wrapper-output=bw_output
sonar.cfamily.threads=4

# Do not report the rules that are against the conventions of this code:
#    - cpp:S3471 and cpp:S3576: we write 'virtual' with 'override'
#    - cpp:S5945: we use C arrays with 'get_array_size'
sonar.issue.ignore.multicriteria=virtual_redundant,virtual_override,c_array
sonar.issue.ignore.multicriteria.virtual_redundant.ruleKey=cpp:S3471
sonar.issue.ignore.multicriteria.virtual_redundant.resourceKey=**/*
sonar.issue.ignore.multicriteria.virtual_override.ruleKey=cpp:S3576
sonar.issue.ignore.multicriteria.virtual_override.resourceKey=**/*
sonar.issue.ignore.multicriteria.c_array.ruleKey=cpp:S5945
sonar.issue.ignore.multicriteria.c_array.resourceKey=**/*
