# Settings for the SonarQube Cloud automatic analysis.
# The automatic analysis does not read sonar-project.properties, which is for an analysis from CI.

# Do not analyze the RTM, sjson-cpp, Catch2, and Google Benchmark submodules.
sonar.exclusions=external/**

# The library must stay valid C++11. Do not report the rules that need a later C++ standard.
sonar.cfamily.reportingCppStandardOverride=c++11

# The automatic analysis does not read issue exclusions from this file. The rules that are against
# the conventions of this code (cpp:S3471, cpp:S3576, and cpp:S5945) are ignored in the project
# settings on sonarcloud.io: Administration > Analysis Scope > Issues.
