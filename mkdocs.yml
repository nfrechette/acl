site_name: Animation Compression Library
site_description: A C++11 library to compress and decompress animation data for games and realtime applications
site_url: https://nfrechette.github.io/acl/
repo_url: https://github.com/nfrechette/acl
repo_name: nfrechette/acl
edit_uri: ''
copyright: Copyright (c) 2017 Nicholas Frechette and Animation Compression Library contributors

# The pages in docs/api/ are generated: run tools/docs/generate_api_docs.py before mkdocs.
docs_dir: docs
site_dir: build/docs/site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use the dark theme
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use the light theme

extra:
  # mike writes one copy of the site for each version, and Material shows a version selector.
  version:
    provider: mike
    default: latest

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# With --strict, a page that is not in the nav or a link to a page that does not exist stops the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# A page without a title in the nav uses the title of its first heading.
nav:
  - Home: README.md
  - Getting started: getting_started.md
  - Algorithms:
      - algorithm_uniformly_sampled.md
  - Integration:
      - Handling asserts: handling_asserts.md
      - Configuration macros: configuration_macros.md
      - Implementing an allocator: implementing_an_allocator.md
      - Creating a raw track list: creating_a_raw_track_list.md
      - Pre-processing a raw track list: pre_processing_raw_tracks.md
      - Compressing tracks: compressing_raw_tracks.md
      - Decompressing tracks: decompressing_a_track_list.md
      - Handling looping playback: handling_looping_playback.md
      - Handling per track rounding: handling_per_track_rounding.md
      - Extended samples: extended_samples.md
      - Additive clips: additive_clips.md
      - Error metrics: error_metrics.md
      - Default sub-track handling: default_sub_track_handling.md
      - Database and streaming support: database_support.md
      - Other considerations: misc_integration_details.md
      - Migrating from an earlier ACL version: migrating.md
  - Performance:
      - cmu_performance.md
      - paragon_performance.md
      - fight_scene_performance.md
      - decompression_performance.md
  - Research:
